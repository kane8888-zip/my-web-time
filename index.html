<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <title>Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- 主题变量 ---------- */
    :root {
      --bg: #f8fafc;
      --panel-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --text-dim: #64748b;
      --text-faint: #94a3b8;
      --accent: #2563eb;
      --btn-bg: #ffffff;
      --btn-hover: #e2e8f0;
      --card-bg: #f1f5f9;
    }

    body.theme-gray   { --bg:#1c1c1e; --panel-bg:#2c2c2e; --border:#3a3a3c; --text:#d4d4d8; --text-muted:#a1a1aa; --text-dim:#8e8e93; --text-faint:#636366; --btn-bg:#2c2c2e; --btn-hover:#3a3a3c; --card-bg:#1c1c1e; --accent:#0a84ff; }

    body.theme-white  { --bg:#f8fafc; --panel-bg:#fff;    --border:#cbd5e1; --text:#0f172a; --text-muted:#475569; --text-dim:#64748b; --text-faint:#94a3b8; --btn-bg:#fff;    --btn-hover:#e2e8f0; --card-bg:#f1f5f9; --accent:#2563eb; }

    body.theme-red    { --bg:#fff1f2; --panel-bg:#ffe4e6; --border:#fda4af; --text:#7f1d1d; --text-muted:#b91c1c; --text-dim:#dc2626; --text-faint:#f87171; --btn-bg:#ffe4e6; --btn-hover:#fecdd3; --card-bg:#fff5f6; --accent:#e11d48; }

    body.theme-yellow { --bg:#fefce8; --panel-bg:#fef9c3; --border:#fde047; --text:#713f12; --text-muted:#a16207; --text-dim:#ca8a04; --text-faint:#eab308; --btn-bg:#fef9c3; --btn-hover:#fef08a; --card-bg:#fffef5; --accent:#ca8a04; }

    body.theme-green  { --bg:#f0fdf4; --panel-bg:#dcfce7; --border:#86efac; --text:#14532d; --text-muted:#15803d; --text-dim:#16a34a; --text-faint:#4ade80; --btn-bg:#dcfce7; --btn-hover:#bbf7d0; --card-bg:#f5fff8; --accent:#16a34a; }

    body.theme-blue   { --bg:#f0f9ff; --panel-bg:#e0f2fe; --border:#7dd3fc; --text:#0c4a6e; --text-muted:#0369a1; --text-dim:#0284c7; --text-faint:#38bdf8; --btn-bg:#e0f2fe; --btn-hover:#bae6fd; --card-bg:#f5fbff; --accent:#0284c7; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Mono", "Consolas", "Roboto Mono", "Courier New", monospace;
      position: relative;
      transition: background 0.3s, color 0.3s;
      padding: 80px 0 64px;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    /* ---------- 顶部工具栏 ---------- */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0 16px;
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .topbar > :first-child { justify-self: start; }
    .topbar > :nth-child(2) { justify-self: center; }
    .topbar > :last-child { justify-self: end; }

    #backBtn {
      height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text-muted);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, color 0.2s;
    }
    #backBtn .icon { font-size: 16px; line-height: 1; }

    #topLangBtn {
      height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text-muted);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, color 0.2s;
    }
    #topLangBtn .arrow { font-size: 11px; opacity: 0.7; }

    #settingsBtn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    @media (hover: hover) {
      #backBtn:hover,
      #topLangBtn:hover,
      #settingsBtn:hover {
        background: var(--btn-hover);
        color: var(--text);
      }
    }

    /* ---------- 右下角全屏按钮 ---------- */
    #fullscreenBtn {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s, opacity 0.2s;
    }
    @media (hover: hover) {
      #fullscreenBtn:hover { background: var(--btn-hover); color: var(--text); }
    }

    /* ---------- 关闭提示 ---------- */
    #closeHint {
      position: fixed;
      top: calc(70px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 200;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      max-width: calc(100vw - 32px);
      text-align: center;
    }
    #closeHint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------- 设置面板 ---------- */
    #settingsPanel {
      position: fixed;
      top: calc(68px + env(safe-area-inset-top, 0px));
      right: 16px;
      z-index: 99;
      width: 320px;
      max-height: calc(100dvh - 90px - env(safe-area-inset-top, 0px));
      overflow-y: auto;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: none;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transition: background 0.3s, border-color 0.3s;
      -webkit-overflow-scrolling: touch;
    }
    #settingsPanel.open { display: block; }
    #settingsPanel h3 {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: normal;
    }
    #settingsPanel .group { margin-bottom: 18px; }
    #settingsPanel select {
      width: 100%;
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    #settingsPanel select:focus { border-color: var(--accent); }

    /* ---------- 主题色选择 ---------- */
    .theme-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .theme-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      position: relative;
    }
    @media (hover: hover) {
      .theme-swatch:hover { transform: scale(1.1); }
    }
    .theme-swatch.active { border-color: var(--text); }
    .theme-swatch.active::after {
      content: "✓";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    /* ---------- 主时钟 ---------- */
    #mainClock { text-align: center; padding: 0 24px; }
    #mainLabel {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #mainTime {
      font-size: clamp(3rem, 12vw, 7rem);
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      line-height: 1.1;
    }
    #mainDate {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-top: 12px;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    #mainTime, #mainDate, #mainLabel {
      user-select: none;
      -webkit-user-select: none;
    }

    html[lang="en"] #mainLabel { letter-spacing: 0.04em; }
    html[lang="en"] #mainTime { font-size: clamp(2.8rem, 11vw, 6.2rem); }

    /* ---------- 底部状态 ---------- */
    #status {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--text-faint);
      min-height: 1em;
      text-align: center;
      padding: 0 16px;
      max-width: calc(100vw - 120px);
    }

    /* =========================================================
       手机端适配（≤ 640px）
       ========================================================= */
    @media (max-width: 640px) {
      body {
        padding: calc(72px + env(safe-area-inset-top, 0px)) 0 calc(72px + env(safe-area-inset-bottom, 0px));
      }

      .topbar {
        padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0 12px;
      }

      #backBtn {
        padding: 0 14px;
        gap: 6px;
        font-size: 13px;
      }
      #topLangBtn {
        height: 38px;
        padding: 0 14px;
        font-size: 12px;
      }
      #settingsBtn {
        width: 42px;
        height: 42px;
        font-size: 20px;
      }

      #mainClock {
        padding: 0 16px;
      }
      #mainLabel {
        font-size: 12px;
        margin-bottom: 10px;
      }
      #mainTime {
        font-size: clamp(2.8rem, 15vw, 4.5rem);
      }
      #mainDate {
        font-size: 0.95rem;
        margin-top: 10px;
        padding: 0 8px;
      }

      #settingsPanel {
        left: 12px;
        right: 12px;
        width: auto;
        top: calc(64px + env(safe-area-inset-top, 0px));
        max-height: calc(100dvh - 96px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        padding: 18px;
      }
      #settingsPanel h3 { font-size: 12px; }
      #settingsPanel select {
        padding: 12px;
        font-size: 16px;
      }

      .theme-swatch {
        width: 40px;
        height: 40px;
      }

      #fullscreenBtn {
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        right: calc(12px + env(safe-area-inset-right, 0px));
        width: 42px;
        height: 42px;
        font-size: 18px;
      }

      #status {
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        left: 12px;
        right: 64px;
        transform: none;
        text-align: left;
        padding: 0;
        font-size: 11px;
        max-width: none;
        line-height: 1.4;
      }

      #closeHint {
        top: calc(64px + env(safe-area-inset-top, 0px));
        font-size: 12px;
        padding: 9px 14px;
      }
    }

    /* 超窄屏（≤ 380px）：返回按钮只留图标 */
    @media (max-width: 380px) {
      #backText { display: none; }
      #backBtn {
        width: 42px;
        padding: 0;
        justify-content: center;
      }
    }
  </style>
</head>
<body class="theme-white">

  <div class="topbar">
    <button id="backBtn" title="Close">
      <span class="icon">←</span>
      <span id="backText">返回</span>
    </button>
    <button id="topLangBtn" title="Language">
      <span id="topLangText">中文</span>
      <span class="arrow">▾</span>
    </button>
    <button id="settingsBtn" title="Settings">⚙</button>
  </div>

  <div id="settingsPanel">
    <div class="group">
      <h3 id="lblTz">时区</h3>
      <select id="timezoneSelect"></select>
    </div>
    <div class="group">
      <h3 id="lblLang">语言</h3>
      <select id="langSelect">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="group">
      <h3 id="lblTheme">主题色</h3>
      <div class="theme-row" id="themeRow">
        <div class="theme-swatch" data-theme="gray"   style="background:#3a3a3c;" title="灰色"></div>
        <div class="theme-swatch" data-theme="white"  style="background:#f8fafc;" title="白色"></div>
        <div class="theme-swatch" data-theme="red"    style="background:#fb7185;" title="红色"></div>
        <div class="theme-swatch" data-theme="yellow" style="background:#facc15;" title="黄色"></div>
        <div class="theme-swatch" data-theme="green"  style="background:#4ade80;" title="绿色"></div>
        <div class="theme-swatch" data-theme="blue"   style="background:#38bdf8;" title="浅蓝"></div>
      </div>
    </div>
  </div>

  <button id="fullscreenBtn" title="Fullscreen">⛶</button>

  <div id="closeHint"></div>

  <div id="mainClock">
    <div id="mainLabel"></div>
    <div id="mainTime">--:--:--</div>
    <div id="mainDate">…</div>
  </div>
  <div id="status"></div>

  <script>
    (function () {
      // ---------- 城市时区列表 ----------
      const CITIES = [
        { key: 'beijing', colo: 'PEK', cityZh: '北京', cityEn: 'Beijing',  tz: 'Asia/Shanghai' },
        { key: 'shanghai', colo: 'SHA', cityZh: '上海', cityEn: 'Shanghai', tz: 'Asia/Shanghai' },
        { key: 'hongkong', colo: 'HKG', cityZh: '香港', cityEn: 'Hong Kong', tz: 'Asia/Hong_Kong' },
        { key: 'tokyo', colo: 'NRT', cityZh: '东京', cityEn: 'Tokyo', tz: 'Asia/Tokyo' },
        { key: 'osaka', colo: 'KIX', cityZh: '大阪', cityEn: 'Osaka', tz: 'Asia/Tokyo' },
        { key: 'seoul', colo: 'ICN', cityZh: '首尔', cityEn: 'Seoul', tz: 'Asia/Seoul' },
        { key: 'singapore', colo: 'SIN', cityZh: '新加坡', cityEn: 'Singapore', tz: 'Asia/Singapore' },
        { key: 'taipei', colo: 'TPE', cityZh: '台北', cityEn: 'Taipei', tz: 'Asia/Taipei' },
        { key: 'bangkok', colo: 'BKK', cityZh: '曼谷', cityEn: 'Bangkok', tz: 'Asia/Bangkok' },
        { key: 'kualalumpur', colo: 'KUL', cityZh: '吉隆坡', cityEn: 'Kuala Lumpur', tz: 'Asia/Kuala_Lumpur' },
        { key: 'jakarta', colo: 'CGK', cityZh: '雅加达', cityEn: 'Jakarta', tz: 'Asia/Jakarta' },
        { key: 'manila', colo: 'MNL', cityZh: '马尼拉', cityEn: 'Manila', tz: 'Asia/Manila' },
        { key: 'sydney', colo: 'SYD', cityZh: '悉尼', cityEn: 'Sydney', tz: 'Australia/Sydney' },
        { key: 'melbourne', colo: 'MEL', cityZh: '墨尔本', cityEn: 'Melbourne', tz: 'Australia/Melbourne' },
        { key: 'auckland', colo: 'AKL', cityZh: '奥克兰', cityEn: 'Auckland', tz: 'Pacific/Auckland' },
        { key: 'london', colo: 'LHR', cityZh: '伦敦', cityEn: 'London', tz: 'Europe/London' },
        { key: 'paris', colo: 'CDG', cityZh: '巴黎', cityEn: 'Paris', tz: 'Europe/Paris' },
        { key: 'frankfurt', colo: 'FRA', cityZh: '法兰克福', cityEn: 'Frankfurt', tz: 'Europe/Berlin' },
        { key: 'amsterdam', colo: 'AMS', cityZh: '阿姆斯特丹', cityEn: 'Amsterdam', tz: 'Europe/Amsterdam' },
        { key: 'madrid', colo: 'MAD', cityZh: '马德里', cityEn: 'Madrid', tz: 'Europe/Madrid' },
        { key: 'rome', colo: 'FCO', cityZh: '罗马', cityEn: 'Rome', tz: 'Europe/Rome' },
        { key: 'warsaw', colo: 'WAW', cityZh: '华沙', cityEn: 'Warsaw', tz: 'Europe/Warsaw' },
        { key: 'moscow', colo: 'SVO', cityZh: '莫斯科', cityEn: 'Moscow', tz: 'Europe/Moscow' },
        { key: 'newyork', colo: 'JFK', cityZh: '纽约', cityEn: 'New York', tz: 'America/New_York' },
        { key: 'losangeles', colo: 'LAX', cityZh: '洛杉矶', cityEn: 'Los Angeles', tz: 'America/Los_Angeles' },
        { key: 'sanfrancisco', colo: 'SFO', cityZh: '旧金山', cityEn: 'San Francisco', tz: 'America/Los_Angeles' },
        { key: 'seattle', colo: 'SEA', cityZh: '西雅图', cityEn: 'Seattle', tz: 'America/Los_Angeles' },
        { key: 'chicago', colo: 'ORD', cityZh: '芝加哥', cityEn: 'Chicago', tz: 'America/Chicago' },
        { key: 'dallas', colo: 'DFW', cityZh: '达拉斯', cityEn: 'Dallas', tz: 'America/Chicago' },
        { key: 'toronto', colo: 'YYZ', cityZh: '多伦多', cityEn: 'Toronto', tz: 'America/Toronto' },
        { key: 'saopaulo', colo: 'GRU', cityZh: '圣保罗', cityEn: 'São Paulo', tz: 'America/Sao_Paulo' },
        { key: 'buenosaires', colo: 'EZE', cityZh: '布宜诺斯艾利斯', cityEn: 'Buenos Aires', tz: 'America/Argentina/Buenos_Aires' },
        { key: 'mexicocity', colo: 'MEX', cityZh: '墨西哥城', cityEn: 'Mexico City', tz: 'America/Mexico_City' },
        { key: 'mumbai', colo: 'BOM', cityZh: '孟买', cityEn: 'Mumbai', tz: 'Asia/Kolkata' },
        { key: 'newdelhi', colo: 'DEL', cityZh: '新德里', cityEn: 'New Delhi', tz: 'Asia/Kolkata' },
        { key: 'dubai', colo: 'DXB', cityZh: '迪拜', cityEn: 'Dubai', tz: 'Asia/Dubai' },
        { key: 'johannesburg', colo: 'JNB', cityZh: '约翰内斯堡', cityEn: 'Johannesburg', tz: 'Africa/Johannesburg' },
        { key: 'cairo', colo: 'CAI', cityZh: '开罗', cityEn: 'Cairo', tz: 'Africa/Cairo' },
        { key: 'lagos', colo: 'LOS', cityZh: '拉各斯', cityEn: 'Lagos', tz: 'Africa/Lagos' },
      ];

      const THEME_COLORS = {
        gray: '#1c1c1e',
        white: '#f8fafc',
        red: '#fff1f2',
        yellow: '#fefce8',
        green: '#f0fdf4',
        blue: '#f0f9ff',
      };

      const I18N = {
        zh: {
          tzLabel: '时区',
          langLabel: '语言',
          themeLabel: '主题色',
          langBtn: '中文',
          back: '返回',
          closeUnsupported: '浏览器不允许脚本直接关闭此标签页，请手动关闭（Ctrl+W / Cmd+W）。',
          statusOk: (rtt, drift) => `时间源：Cloudflare 边缘 · 延迟约 ${rtt} ms · 与本地设备偏差 ${drift} ms`,
          statusErr: (msg) => '获取服务器时间失败，暂时使用本地设备时间：' + msg,
          fullscreen: '全屏',
          exitFullscreen: '退出全屏',
        },
        en: {
          tzLabel: 'Time Zone',
          langLabel: 'Language',
          themeLabel: 'Theme',
          langBtn: 'English',
          back: 'Back',
          closeUnsupported: 'This browser does not allow scripts to close the tab. Please close it manually (Ctrl+W / Cmd+W).',
          statusOk: (rtt, drift) => `Source: Cloudflare edge · RTT ~${rtt} ms · offset vs local ${drift} ms`,
          statusErr: (msg) => 'Failed to fetch server time, using local device time: ' + msg,
          fullscreen: 'Fullscreen',
          exitFullscreen: 'Exit fullscreen',
        },
      };

      // ---------- 状态 ----------
      let serverTimeBase = null;
      let localTimeBase = null;
      let drift = 0;
      let selectedKey = 'beijing';
      let lang = 'zh';
      let theme = 'white';
      let lastStatus = null;

      const mainTimeEl = document.getElementById('mainTime');
      const mainDateEl = document.getElementById('mainDate');
      const mainLabelEl = document.getElementById('mainLabel');
      const statusEl = document.getElementById('status');
      const tzSelect = document.getElementById('timezoneSelect');
      const langSelect = document.getElementById('langSelect');
      const lblTz = document.getElementById('lblTz');
      const lblLang = document.getElementById('lblLang');
      const lblTheme = document.getElementById('lblTheme');
      const themeRow = document.getElementById('themeRow');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const topLangBtn = document.getElementById('topLangBtn');
      const topLangText = document.getElementById('topLangText');
      const backBtn = document.getElementById('backBtn');
      const backText = document.getElementById('backText');
      const closeHint = document.getElementById('closeHint');
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsPanel = document.getElementById('settingsPanel');
      const metaTheme = document.querySelector('meta[name="theme-color"]');

      function getSelectedCity() {
        return CITIES.find(c => c.key === selectedKey) || CITIES[0];
      }

      // ---------- UTC 偏移 ----------
      function getUtcOffset(tz, date = new Date()) {
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          timeZoneName: 'shortOffset',
        }).formatToParts(date);
        const tzPart = parts.find(p => p.type === 'timeZoneName');
        if (!tzPart) return 'UTC';
        let s = tzPart.value.replace('GMT', 'UTC');
        s = s.replace(/UTC([+-])0?(\d+)(?::00)?$/, (m, sign, h) => {
          return h === '0' ? 'UTC' : `UTC${sign}${h}`;
        });
        s = s.replace(/UTC([+-])0?(\d+):(\d{2})$/, (m, sign, h, min) => {
          return `UTC${sign}${h}:${min}`;
        });
        return s;
      }

      // ---------- 时间格式化 ----------
      function fmtTime(ms, tz, locale) {
        return new Intl.DateTimeFormat(locale, {
          timeZone: tz,
          hour: '2-digit', minute: '2-digit', second: '2-digit',
          hour12: false,
        }).format(new Date(ms));
      }

      // ---------- 日期格式化：中文 年-月-日，英文 月-日-年，均不补零 ----------
      function fmtDate(ms, tz, locale) {
        const parts = new Intl.DateTimeFormat(locale, {
          timeZone: tz,
          year: 'numeric',
          month: 'numeric',
          day: 'numeric',
        }).formatToParts(new Date(ms));
        const get = (type) => (parts.find(p => p.type === type) || {}).value || '';
        const year = get('year');
        const month = get('month');
        const day = get('day');
        if (locale === 'zh-CN') {
          // 2026-11-3
          return `${year}-${month}-${day}`;
        }
        // 11-3-2026
        return `${month}-${day}-${year}`;
      }

      function currentServerTime() {
        if (serverTimeBase === null) return Date.now();
        return serverTimeBase + (performance.now() - localTimeBase);
      }

      // ---------- 渲染 ----------
      function render() {
        const now = currentServerTime();
        const locale = lang === 'zh' ? 'zh-CN' : 'en-US';
        const city = getSelectedCity();
        mainTimeEl.textContent = fmtTime(now, city.tz, locale);
        mainDateEl.textContent = fmtDate(now, city.tz, locale);
        requestAnimationFrame(render);
      }

      // ---------- 时区下拉 ----------
      function rebuildTzSelect() {
        tzSelect.innerHTML = '';
        CITIES.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.key;
          const cityName = lang === 'zh' ? c.cityZh : c.cityEn;
          const offset = getUtcOffset(c.tz);
          opt.textContent = `${cityName} (${c.colo}) · ${offset}`;
          if (c.key === selectedKey) opt.selected = true;
          tzSelect.appendChild(opt);
        });
      }

      function updateMainLabel() {
        const city = getSelectedCity();
        mainLabelEl.textContent = lang === 'zh' ? city.cityZh : city.cityEn;
      }

      // ---------- 主题 ----------
      function applyTheme(t) {
        theme = t;
        document.body.className = 'theme-' + t;
        if (metaTheme) {
          metaTheme.setAttribute('content', THEME_COLORS[t] || '#f8fafc');
        }
        themeRow.querySelectorAll('.theme-swatch').forEach(el => {
          el.classList.toggle('active', el.dataset.theme === t);
        });
        updateThemeTitles();
      }

      function updateThemeTitles() {
        const titlesZh = { gray:'灰色', white:'白色', red:'红色', yellow:'黄色', green:'绿色', blue:'浅蓝' };
        const titlesEn = { gray:'Gray', white:'White', red:'Red', yellow:'Yellow', green:'Green', blue:'Light Blue' };
        themeRow.querySelectorAll('.theme-swatch').forEach(el => {
          el.title = lang === 'zh' ? titlesZh[el.dataset.theme] : titlesEn[el.dataset.theme];
        });
      }

      // ---------- 全屏 ----------
      function updateFullscreenBtn() {
        const isFs = !!document.fullscreenElement;
        fullscreenBtn.textContent = '⛶';
        fullscreenBtn.title = isFs ? I18N[lang].exitFullscreen : I18N[lang].fullscreen;
        fullscreenBtn.style.opacity = isFs ? '0.6' : '1';
      }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (e) {
          // 某些环境不允许全屏，忽略
        }
        updateFullscreenBtn();
      }

      // ---------- 关闭标签页 ----------
      function showCloseHint() {
        closeHint.textContent = I18N[lang].closeUnsupported;
        closeHint.classList.add('show');
        clearTimeout(showCloseHint._t);
        showCloseHint._t = setTimeout(() => {
          closeHint.classList.remove('show');
        }, 3000);
      }

      function tryCloseTab() {
        try {
          window.close();
        } catch (e) {
          // ignore
        }
        setTimeout(() => {
          if (!document.hidden && !window.closed) {
            showCloseHint();
          }
        }, 200);
      }

      // ---------- 应用语言 ----------
      function applyLang() {
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.title = lang === 'zh' ? '全球时钟' : 'World Clock';

        lblTz.textContent = I18N[lang].tzLabel;
        lblLang.textContent = I18N[lang].langLabel;
        lblTheme.textContent = I18N[lang].themeLabel;
        topLangText.textContent = I18N[lang].langBtn;
        topLangBtn.title = lang === 'zh' ? 'Switch to English' : '切换到中文';
        backText.textContent = I18N[lang].back;
        backBtn.title = I18N[lang].back;
        langSelect.value = lang;

        rebuildTzSelect();
        updateMainLabel();
        updateThemeTitles();
        updateFullscreenBtn();

        if (lastStatus && lastStatus.type === 'ok') {
          statusEl.textContent = I18N[lang].statusOk(lastStatus.rtt, lastStatus.drift);
        } else if (lastStatus && lastStatus.type === 'err') {
          statusEl.textContent = I18N[lang].statusErr(lastStatus.msg);
        }
      }

      // ---------- 同步 ----------
      async function syncTime() {
        try {
          const t0 = performance.now();
          const res = await fetch('/api/time', { cache: 'no-store' });
          const t1 = performance.now();
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const rtt = t1 - t0;
          serverTimeBase = data.serverTime + rtt / 2;
          localTimeBase = performance.now();
          drift = serverTimeBase - Date.now();
          lastStatus = { type: 'ok', rtt: Math.round(rtt), drift: Math.round(drift) };
          statusEl.textContent = I18N[lang].statusOk(lastStatus.rtt, lastStatus.drift);
        } catch (e) {
          serverTimeBase = null;
          lastStatus = { type: 'err', msg: e.message };
          statusEl.textContent = I18N[lang].statusErr(e.message);
        }
      }

      // ---------- 设置面板开关 ----------
      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsPanel.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
          settingsPanel.classList.remove('open');
        }
      });

      // ---------- 事件 ----------
      backBtn.addEventListener('click', tryCloseTab);

      topLangBtn.addEventListener('click', () => {
        lang = lang === 'zh' ? 'en' : 'zh';
        applyLang();
      });

      tzSelect.addEventListener('change', () => {
        selectedKey = tzSelect.value;
        updateMainLabel();
      });

      langSelect.addEventListener('change', () => {
        lang = langSelect.value;
        applyLang();
      });

      themeRow.addEventListener('click', (e) => {
        const sw = e.target.closest('.theme-swatch');
        if (sw) applyTheme(sw.dataset.theme);
      });

      fullscreenBtn.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', updateFullscreenBtn);

      // ---------- 启动 ----------
      applyTheme('white');
      applyLang();
      syncTime().then(() => render());

      setInterval(syncTime, 10 * 60 * 1000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) syncTime();
      });
    })();
  </script>
</body>
</html>
